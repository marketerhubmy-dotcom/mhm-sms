# MHM SMS — Cloudflare Pages (frontend). Deploy: npm run deploy:web
# Pages Function di functions/api/[[path]].ts menghantar /api/* ke Worker melalui service binding.
name = "mhm-sms"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

# Production (cawangan production Pages) -> Worker "mhm-sms-api"
[[services]]
binding = "API"
service = "mhm-sms-api"

# Preview deployments -> Worker staging
[[env.preview.services]]
binding = "API"
service = "mhm-sms-staging"
