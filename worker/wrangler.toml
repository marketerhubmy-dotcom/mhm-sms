# MHM SMS — Worker backend (API).
# Persekitaran: development (lalai, local), staging, production. Setiap satu ada D1 berasingan.
# SECRETS TIDAK disimpan di sini. Tetapkan dengan: wrangler secret put <NAMA> -c worker/wrangler.toml --env <env>
name = "mhm-sms-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[vars]
APP_ENV = "development"
APP_BASE_URL = "http://localhost:5173"
SMS_PROVIDER = "mock"
PAYMENT_PROVIDER = "mock"
LIVE_PURCHASES_ENABLED = "false"
LIVE_PAYMENTS_ENABLED = "false"
EMAIL_PROVIDER = "none"
SUPPORT_EMAIL = "support@mhmacademy.site"
EXTRA_ALLOWED_ORIGINS = "http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173"

[[d1_databases]]
binding = "DB"
database_name = "mhm-sms-dev"
database_id = "00000000-0000-0000-0000-000000000000" # local sahaja
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

# ---------------------------------------------------------------- staging (CHIP mod UJIAN)
# Satu Worker menyajikan frontend + /api di https://mhm-sms-staging.marketerhubmy.workers.dev
# Nombor OnlineSIM SEBENAR (admin sahaja, had 5/hari) + CHIP dengan kunci UJIAN sahaja (kod menolak bil bukan ujian).
# Untuk kembali ke nombor simulasi: SMS_PROVIDER = "mock".
# Secrets: CHIP_SECRET_KEY (kunci ujian), CHIP_BRAND_ID, ONLINESIM_API_KEY  ->  wrangler secret put <NAMA> -c worker/wrangler.toml --env staging
[env.staging]
name = "mhm-sms-staging"
workers_dev = true
[env.staging.vars]
APP_ENV = "staging"
APP_BASE_URL = "https://mhm-sms-staging.marketerhubmy.workers.dev"
SMS_PROVIDER = "onlinesim"
ONLINESIM_BASE_URL = "https://onlinesim.io"
PAYMENT_PROVIDER = "chip"
CHIP_BASE_URL = "https://gate.chip-in.asia/api/v1"
LIVE_PURCHASES_ENABLED = "true"  # staging: admin sahaja, had 5 pesanan/hari (dikuatkuasakan kod)
LIVE_PAYMENTS_ENABLED = "true"  # selamat: chipTestOnly memaksa is_test=true
EMAIL_PROVIDER = "none"
SUPPORT_EMAIL = "support@mhmacademy.site"
EXTRA_ALLOWED_ORIGINS = ""
[env.staging.assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
[[env.staging.d1_databases]]
binding = "DB"
database_name = "mhm-sms-staging"
database_id = "c6433c7d-b1c2-49a4-86ae-d8c30f0946f3"
migrations_dir = "migrations"
[env.staging.triggers]
crons = ["* * * * *"]

# ---------------------------------------------------------------- production
# Satu Worker menyajikan frontend + /api di https://sms.mhmacademy.site (Workers Custom Domain).
# Jualan OFF secara lalai: LIVE_PURCHASES_ENABLED / LIVE_PAYMENTS_ENABLED = "false".
# Secrets (production SAHAJA, jangan kongsi dengan staging):
#   ONLINESIM_API_KEY  (akaun OnlineSIM khusus laman), CHIP_SECRET_KEY (kunci LIVE), CHIP_BRAND_ID
[env.production]
name = "mhm-sms-prod"
workers_dev = false
routes = [{ pattern = "sms.mhmacademy.site", custom_domain = true }]
[env.production.vars]
APP_ENV = "production"
APP_BASE_URL = "https://sms.mhmacademy.site"
SMS_PROVIDER = "onlinesim"
ONLINESIM_BASE_URL = "https://onlinesim.io"
PAYMENT_PROVIDER = "chip"
CHIP_BASE_URL = "https://gate.chip-in.asia/api/v1"
LIVE_PURCHASES_ENABLED = "false"
LIVE_PAYMENTS_ENABLED = "false"
EMAIL_PROVIDER = "none"
SUPPORT_EMAIL = "support@mhmacademy.site"
EXTRA_ALLOWED_ORIGINS = ""
[env.production.assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
[[env.production.d1_databases]]
binding = "DB"
database_name = "mhm-sms-prod"
database_id = "REPLACE_WITH_PRODUCTION_D1_ID"
migrations_dir = "migrations"
[env.production.triggers]
crons = ["* * * * *"]

# ---------------------------------------------------------------- demo (awam, SIMULASI)
# Satu Worker menyajikan frontend (web/dist) DAN /api pada URL yang sama (*.workers.dev),
# jadi cookie, CSRF dan /api same-origin tanpa Pages. Mock dipaksa; tiada secrets diperlukan.
# Deploy: npm run deploy:demo   (selepas isi database_id dan APP_BASE_URL di bawah)
[env.demo]
name = "mhm-sms-demo"
workers_dev = true
[env.demo.vars]
EXTRA_ALLOWED_ORIGINS = ""
APP_ENV = "demo"
APP_BASE_URL = "https://mhm-sms-demo.marketerhubmy.workers.dev"
SMS_PROVIDER = "mock"
PAYMENT_PROVIDER = "mock"
LIVE_PURCHASES_ENABLED = "false"
LIVE_PAYMENTS_ENABLED = "false"
EMAIL_PROVIDER = "none"
SUPPORT_EMAIL = "support@mhmacademy.site"
[env.demo.assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
[[env.demo.d1_databases]]
binding = "DB"
database_name = "mhm-sms-demo"
database_id = "7ed93a3a-73f1-4979-92de-32928aced353"
migrations_dir = "migrations"
[env.demo.triggers]
crons = ["* * * * *"]
